name: memorygate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      adapter:
        description: "Adapter to gate (built-in name or module:factory)"
        default: better

permissions:
  contents: read
  pull-requests: write

env:
  # Point this at your own memory system, e.g. "myproject.memory:build".
  # Set the repository variable MEMORYGATE_ADAPTER, or use the dispatch input.
  ADAPTER: ${{ inputs.adapter || vars.MEMORYGATE_ADAPTER || 'better' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: Run regression gate
        id: gate
        continue-on-error: true
        run: |
          memorygate gate --adapter "$ADAPTER" \
            --report-md memorygate-report.md --report-json memorygate-report.json
      - name: Job summary
        if: always() && hashFiles('memorygate-report.md') != ''
        run: cat memorygate-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post metrics diff on the PR
        if: github.event_name == 'pull_request' && hashFiles('memorygate-report.md') != ''
        # Fork PRs get a read-only token; commenting is best-effort, the gate result still counts.
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('memorygate-report.md', 'utf8');
            const marker = '<!-- memorygate-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: memorygate-report
          path: memorygate-report.*
          if-no-files-found: ignore
      - name: Fail the check on regression
        if: steps.gate.outcome == 'failure'
        run: |
          echo "MemoryGate: statistically meaningful quality drop (see report)." >&2
          exit 1
